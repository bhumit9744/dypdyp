services:
  # -----------------------------------------------------------
  # Placement Hub — Python FastAPI Backend Web Service
  # -----------------------------------------------------------
  - type: web
    name: placement-hub-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: VAPI_API_KEY
        sync: false
      - key: VAPI_ASSISTANT_ID
        sync: false

  # -----------------------------------------------------------
  # Placement Hub — React 19 + Vite Frontend Static Site
  # -----------------------------------------------------------
  - type: web
    name: placement-hub-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: placement-hub-backend
          property: host
